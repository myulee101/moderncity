<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#080D16;--bg2:#101B2B;--ac:#42E8D5;--bl:#70AFFF;--tx:#EEF3F8;--mu:#9AABBF;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--tx);font:400 17px/1.65 Manrope,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo{font-family:Unbounded,Manrope,system-ui,sans-serif;font-weight:300;letter-spacing:.02em}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) 5vw 14px;background:rgba(8,13,22,.65);backdrop-filter:blur(14px);border-bottom:1px solid rgba(66,232,213,.15)}
.logo{color:var(--ac);font-weight:500;text-decoration:none;letter-spacing:.12em}
nav ul{display:flex;gap:6px;list-style:none;padding:0;overflow-x:auto;min-width:0}
nav a.l{display:block;padding:8px 14px;border-radius:99px;color:var(--mu);text-decoration:none;font-size:15px;white-space:nowrap;transition:.25s}
nav a.l:hover,nav a.l.on{color:var(--ac);background:rgba(66,232,213,.09)}
a:focus-visible,button:focus-visible,.dist:focus-visible{outline:2px solid var(--bl);outline-offset:3px}
#view{animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:110px 6vw 60px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,rgba(66,232,213,.28),transparent 55%),linear-gradient(#080D16,#101B2B 70%,#0b2a33)}
.hero svg.sky{position:absolute;inset:auto 0 0 0;width:100%;height:60%;opacity:.9}
.hero>div{position:relative;max-width:760px}
.hero h1{font-size:clamp(28px,7.2vw,88px);line-height:1.02;background:linear-gradient(90deg,#fff,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 18px rgba(66,232,213,.55))}}
.hero h2{font-size:clamp(14px,2.4vw,24px);letter-spacing:.5em;color:var(--bl);margin:12px 0 34px}

.hero p.s{color:var(--mu);max-width:560px;margin:0 auto 38px}

.btn:hover{background:var(--ac);color:var(--bg);box-shadow:0 0 34px rgba(66,232,213,.55)}
section,.pg{padding:90px 6vw;max-width:1240px;margin:0 auto}
.pg{padding-top:130px}
h2.t{font-size:clamp(26px,4vw,44px);margin-bottom:14px}
.lead{color:var(--mu);max-width:640px;margin-bottom:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(112,175,255,.2);border-radius:18px;overflow:hidden;backdrop-filter:blur(10px);transition:.35s;cursor:default}
.card:hover{transform:translateY(-6px);border-color:var(--ac);box-shadow:0 0 30px rgba(66,232,213,.2)}
.card .art{height:170px;display:block;width:100%}
.card div.b{padding:20px 22px 24px}
.card h3{font-size:17px;margin-bottom:8px;color:var(--ac)}
.card p{color:var(--mu);font-size:15px;line-height:1.55}
.wide{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:40px}
.glass{background:rgba(16,27,43,.7);border:1px solid rgba(66,232,213,.2);border-radius:18px;padding:26px}
.glass h3{font-size:16px;margin-bottom:10px}
.bar{margin:14px 0}
.bar span{display:flex;justify-content:space-between;font-size:14px;color:var(--mu);margin-bottom:6px}
.bar i{display:block;height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar b{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--bl),var(--ac));box-shadow:0 0 12px var(--ac);transition:width 1.4s ease}
.note{font-size:13px;color:var(--mu);margin-top:16px}
.mapbox{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:820px){.mapbox{grid-template-columns:1fr}nav{flex-direction:column;align-items:stretch;gap:6px}nav ul{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}nav ul::-webkit-scrollbar{display:none}nav li{flex:none}}
.dist{cursor:pointer;transition:.3s;outline:none}
.dist:hover,.dist.on{filter:drop-shadow(0 0 12px #42E8D5);fill-opacity:.55}
#info h3{font-size:20px;color:var(--ac);margin:14px 0 6px}
#info ul{padding-left:20px;color:var(--mu);margin-top:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid rgba(112,175,255,.2);border-radius:18px;overflow:hidden;margin-bottom:18px}
.pair div{padding:22px}.pair div:first-child{background:rgba(112,175,255,.07)}
.pair small{color:var(--bl);font-size:13px;display:block;margin-bottom:6px}
@media(max-width:620px){.pair{grid-template-columns:1fr}}
.fin{text-align:center;padding:140px 6vw;background:radial-gradient(ellipse at 50% 100%,rgba(255,150,80,.35),transparent 60%),linear-gradient(#101B2B,#080D16);margin-top:60px}
.fin h2{font-size:clamp(28px,6vw,64px);margin-bottom:20px}
.fin p{max-width:560px;margin:0 auto 34px;color:var(--mu)}
.rv{opacity:0;transform:translateY(24px);transition:.8s}.rv.in{opacity:1;transform:none}
footer{padding:30px 6vw;text-align:center;color:var(--mu);font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}.rv{opacity:1;transform:none}}
</style>
</head>
